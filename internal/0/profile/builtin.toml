# canary-spinclass is canary-grit (below) with moxy dropped whole, for
# confined runs that test spinclass's grit with no moxy server in the unit at
# all. Its spinclass and just-us selections are canary-grit's (a test pins it).
[[profile]]
name = "canary-spinclass"
display = "Canary (minimal worker, spinclass grit, no moxy)"
provider = "claude"
backend = "anthropic"
model = "claude-sonnet-5-5"
context_servers = ["clown-builtin-jobs/ringmaster", "clown-builtin-jobs/troupe", "spinclass/spinclass", "just-us/just-us"]

[profile.env]
CLOWN_DISABLE_CLAUDEAI_CONNECTORS = "1"
CLOWN_DISALLOWED_TOOLS = "Artifact,ArtifactData,ArtifactComments,DesignSync,Workflow,SendFeedback,EnterPlanMode,ExitPlanMode,ScheduleWakeup,CronCreate,CronDelete,CronList,RemoteTrigger,EndConversation,ReportFindings,PushNotification,ListMcpResourcesTool,ReadMcpResourceTool,ReadMcpResourceDirTool,WaitForMcpServers,Agent"

[profile.context_excluded]
"spinclass/spinclass" = [
  "close-child-session", "grant-session-handle", "list", "merge-this-session", "merge-this-session-async",
  "nothing-but-the-truth", "perms-list", "release-session-handle", "resurrect", "session-job-cancel",
  "spawn-session", "update-this-session-description", "validate",
]
"just-us/just-us" = ["dump_justfile", "list_variables"]

# Like canary-spinclass, worker disallows the Agent tool: with moxy dropped a
# subagent has no search tool and claude refuses a subagent with no tools
# (clown#331; docs/plans/2026-10-26-subagents-in-confined-sessions.md).
#
# worker is the confined unattended worker (clown 2026-10-26 ruling): the
# canary-spinclass surface with the landing tools kept, so a worker that is
# spawned confined can commit through spinclass's grit, run recipes, attest and
# merge its own session. Moxy is dropped whole and just-us kept, so it passes
# spinclass's confined-spawn rule; connectors are off (operator ruling: no
# worker profile turns claude.ai connectors on). It also keeps the issue-filer
# moxin, which clown serves in the frontend and forwards into the unit
# (cmd/clown/frontendmoxin.go); a launch that does not serve it (the moxin or
# its token file is missing, or the launch is unconfined) skips the saved
# server and the worker just lacks that tool. See
# docs/plans/2026-10-26-confined-moxy-sequencing.md.
#
# Unlike every other template, worker keeps ReadMcpResourceTool (operator
# ruling 2026-11-05): ringmaster serves a job's output and records as MCP
# resources (ringmaster://jobs/<id>/output, /records; ringmaster#43), scoped to
# the caller's own channel, and a dontAsk worker has no other way to read
# them. The job wake names the URI, so ListMcpResourcesTool and
# ReadMcpResourceDirTool stay disallowed.
[[profile]]
name = "worker"
display = "Worker (confined unattended: edit, commit, run recipes, merge, file issues)"
provider = "claude"
backend = "anthropic"
model = "claude-sonnet-5-5"
context_servers = ["clown-builtin-jobs/ringmaster", "clown-builtin-jobs/troupe", "spinclass/spinclass", "just-us/just-us", "clown-builtin-moxins/issue-filer", "clown-builtin-diagnostics/disconnects"]

[profile.env]
CLOWN_DISABLE_CLAUDEAI_CONNECTORS = "1"
CLOWN_DISALLOWED_TOOLS = "Artifact,ArtifactData,ArtifactComments,DesignSync,Workflow,SendFeedback,EnterPlanMode,ExitPlanMode,ScheduleWakeup,CronCreate,CronDelete,CronList,RemoteTrigger,EndConversation,ReportFindings,PushNotification,ListMcpResourcesTool,ReadMcpResourceDirTool,WaitForMcpServers,Agent"

[profile.context_excluded]
"spinclass/spinclass" = [
  "close-child-session", "grant-session-handle", "list", "perms-list", "release-session-handle",
  "resurrect", "session-job-cancel", "spawn-session", "validate",
]
"just-us/just-us" = ["dump_justfile", "list_variables"]

# engineer-debug is the read-only debugging template (clown#345): moxy keeps
# the folio read tools (read, ls, glob, tree), rg, jq, man, toolbox, freud, env,
# smith's read verbs, stats-me (all five tools are queries) and chix's read-only
# subset (search, which, doc, doc-options, doc-tree, flake-show, store-ls,
# store-cat, store-path-info, derivation-show, log, why-depends); just-us stays
# whole. Excluded: folio write/rm/mv/cp/chmod/link/mkdir; all of grit (moxy's
# grit tools each mix read and write verbs, and a profile excludes whole tools,
# not verbs); smith's write verbs; chrest; the Google tools; moxy's
# async/batch/restart; the nebulous tools (several write to NewsBlur);
# issue-filer_file (files a forge issue); and the chix tools that build, run, lock or change the
# store or flake (build, run, develop-run, flake-check, flake-lock, flake-init,
# flake-update, store-gc, store-realize, nix-hash).
# Like worker it allows ReadMcpResourceTool (ringmaster serves job output and
# records as resources), so the others' "only worker reads MCP resources" rule
# is now "worker and engineer-debug". It keeps moxy, so Agent stays allowed.
# Refine over time.
[[profile]]
name = "engineer-debug"
display = "Engineer (read-only debugging)"
provider = "claude"
backend = "anthropic"
model = "claude-sonnet-5-5"
context_servers = ["clown-builtin-jobs/ringmaster", "clown-builtin-jobs/troupe", "moxy/moxy", "just-us/just-us"]

