# Task-typed context-floor templates for spawned workers. Each keeps only the
# MCP servers and moxy tools its task calls (a saved --cheap-context
# selection), switches the claude.ai connectors off, and disallows the builtin
# tools no worker uses; the global --disallowed-tools set still applies. The
# knobs ride the env table (CLOWN_DISABLE_CLAUDEAI_CONNECTORS,
# CLOWN_DISALLOWED_TOOLS), so no profile-protocol bump is needed. Lists derived
# from real worker transcripts against moxy's 156-tool catalog: every template's
# keep set plus its context_excluded."moxy/moxy" partitions that catalog.

[[profile]]
name = "reviewer"
display = "Reviewer (read-mostly worker)"
provider = "claude"
backend = "anthropic"
model = "claude-sonnet-5-5"
context_servers = ["clown-builtin-jobs/ringmaster", "clown-builtin-jobs/troupe", "moxy/moxy"]

[profile.env]
CLOWN_DISABLE_CLAUDEAI_CONNECTORS = "1"
CLOWN_DISALLOWED_TOOLS = "Artifact,ArtifactData,ArtifactComments,DesignSync,Workflow,SendFeedback,EnterPlanMode,ExitPlanMode,ScheduleWakeup,CronCreate,CronDelete,CronList,RemoteTrigger,EndConversation,ReportFindings,PushNotification,ListMcpResourcesTool,ReadMcpResourceTool,ReadMcpResourceDirTool,WaitForMcpServers"

[profile.context_excluded]
"moxy/moxy" = [
  "async", "async-cancel", "async-result", "batch", "calendar_agenda",
  "car_doc-graph", "car_export", "car_get", "car_list", "car_search",
  "chix_build", "chix_derivation-show", "chix_develop-run", "chix_doc", "chix_doc-options",
  "chix_doc-tree", "chix_flake-check", "chix_flake-init", "chix_flake-lock", "chix_flake-show",
  "chix_flake-update", "chix_log", "chix_nix-hash", "chix_run", "chix_search",
  "chix_store-cat", "chix_store-gc", "chix_store-ls", "chix_store-path-info", "chix_store-realize",
  "chix_which", "chix_why-depends",
  "chrest_browser-info", "chrest_capture", "chrest_close-tab", "chrest_close-window", "chrest_create-tab",
  "chrest_create-window", "chrest_get-tab", "chrest_get-window", "chrest_init", "chrest_items-get",
  "chrest_items-put", "chrest_list-extensions", "chrest_list-tabs", "chrest_list-windows", "chrest_read-resource",
  "chrest_resource-read", "chrest_resource-templates", "chrest_state-get", "chrest_state-restore", "chrest_update-tab",
  "chrest_update-window",
  "env_clock", "env_cpu", "env_date", "env_get", "env_loadavg", "env_meminfo", "env_resolve", "env_uptime", "env_which",
  "folio_chmod", "folio_cp", "folio_df", "folio_du", "folio_file-type", "folio_link", "folio_mkdir", "folio_mktemp",
  "folio_mv", "folio_rm", "folio_tar", "folio_write",
  "freud_interruptions", "freud_interruptions-timeseries", "freud_messages", "freud_sessions", "freud_subagents",
  "freud_summary", "freud_tool-frequency", "freud_tool-results-summary", "freud_tool-results-timeseries",
  "freud_tool-usage", "freud_transcript", "freud_unique-tools",
  "gmail_read", "gmail_triage",
  "grit_clone", "grit_commit", "grit_merge", "grit_remote", "grit_stash", "grit_tag", "grit_worktree",
  "gws_api",
  "piers_batch-update", "piers_comment", "piers_create", "piers_get", "piers_outline", "piers_tab", "piers_update",
  "prison_get", "restart",
  "smith_issue-close", "smith_issue-comment", "smith_issue-create", "smith_issue-edit", "smith_issue-edit-labels",
  "smith_issue-edit-milestone", "smith_issue-watch", "smith_milestone-create", "smith_milestone-delete",
  "smith_milestone-edit", "smith_milestone-list", "smith_pr-comment", "smith_pr-create", "smith_pr-merge",
  "smith_pr-watch", "smith_release-create", "smith_release-delete", "smith_release-list", "smith_release-view",
  "smith_repo-label-create", "smith_repo-label-delete", "smith_repo-label-list", "smith_tag-create",
  "smith_tag-delete", "smith_tag-list", "smith_tag-view", "smith_whoami",
  "stats-me_export", "stats-me_labels", "stats-me_query", "stats-me_range", "stats-me_series",
  "status",
]

